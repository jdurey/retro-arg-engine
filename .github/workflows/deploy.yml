name: Deploy Massive ARG Swarm to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'youtube/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate phrase bank (canon, slots, period, freshness)
        run: node scripts/build_bank.mjs --check

      - name: Build the Web Swarm
        run: |
          python3 src/build.py
          node deploy/list_urls.mjs site > /dev/null

      - name: Canon scan (no Sloan Rhodes in published output)
        run: |
          if grep -rli "sloan" site/; then echo "Forbidden canon name found in site/"; exit 1; fi

      - name: Check generated swarm (links, slots, render budget)
        run: node scripts/check_swarm.mjs site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
