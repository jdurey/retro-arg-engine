name: Daily Listener Discovery, IndexNow & Wayback Seeder

on:
  schedule:
    - cron: "15 3 * * *"  # Once daily at 03:15 UTC (12:15 KST); zero hourly bot/commit spam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    if: vars.INDEXNOW_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seed 13 Root Domains & Listener Guides to IndexNow, WebSub & RAG Proxies
        run: python3 scripts/publish_da99_authority_network.py || true
      - name: Archive Up to 3 Unarchived Listener/Guide Nodes to Internet Archive Wayback Machine
        run: node deploy/archive_wayback.mjs --limit 3 || true



