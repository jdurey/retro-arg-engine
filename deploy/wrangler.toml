name = "retro-arg-router"
main = "worker.js"
compatibility_date = "2024-03-20"

routes = [
  { pattern = "*stardust-archive.net/*", zone_name = "stardust-archive.net" },
  # Federated Sister Domains (Uncomment each route after adding the domain zone to Cloudflare):
  # { pattern = "*ashford-poly.org/*", zone_name = "ashford-poly.org" },
  # { pattern = "*kamome-net.org/*", zone_name = "kamome-net.org" },
  # { pattern = "*relcom-node08.org/*", zone_name = "relcom-node08.org" },
  # { pattern = "*redcoyoacan.org/*", zone_name = "redcoyoacan.org" },
]

[[kv_namespaces]]
binding = "STARDUST_TELEMETRY_KV"
id = "bba05b61fa854e3fadf6ed52572392ee"

[ai]
binding = "AI"

[vars]
# You will set this to your Cloudflare Pages URL after uploading the static files
BASE_STATIC_URL = "https://jdurey.github.io/retro-arg-engine"
# Generated swarm rollout cap (deploy/swarm/index.js). Empty = follow the weekly
# schedule (50k at launch, +50k/week, max 300k). "0" switches the swarm off.
SWARM_CAP = ""
FRONTIER_POLICY_KEY = "STARDUST-RSI-B2-0x1983-0xEC1B-OUROBOROS"
